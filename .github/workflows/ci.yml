# Checks every push to main and every pull request: the extension lints, builds as the Store
# will, and its tests pass. It sits outside extension/, so `npm run publish` doesn't copy
# it into raycast/extensions.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          # Node 22, as docs/development.md asks and Raycast runs extensions on.
          node-version: 22.x
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      # `ray lint` checks that the owner, the snowhound Raycast organization, exists. The
      # organization isn't visible without signing in, so the lint signs in with a Raycast
      # token (docs/development.md, "Continuous integration").
      - run: npm run lint
        env:
          RAY_TOKEN: ${{ secrets.RAY_TOKEN }}
      # The distribution build type-checks, and writes raycast-env.d.ts, the types the tests'
      # type-check needs.
      - run: npm run build
      - run: npm test
