<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Start Timer · Snowtime for Raycast</title>
    <link rel="stylesheet" href="raycast.css" />
    <script src="fixtures.js"></script>
    <script src="raycast.js"></script>
  </head>
  <body>
    <script>
      // Start Timer (task 001, subtask 02; tasks 005 and 006): a list whose search bar is the
      // description. Rows are recent entries to start again; with no match, ↵ opens the timer
      // form (timer-form.html) with what was typed. New Timer (⌘N) opens it from any row,
      // with what was typed or empty.
      const { orgs, projects, running, entries, format, NOW } = Fixtures;

      // The default of the Suggestions From preference: today and yesterday.
      const since = new Date(NOW);
      since.setDate(since.getDate() - 1);
      since.setHours(0, 0, 0, 0);
      const remembered = projects.website;

      // One row per description, ticket, and project, at its newest entry.
      function suggestions(org = orgs.northwind, extra = []) {
        const seen = new Set();
        return [...extra, ...entries]
          .sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt))
          .filter((e) => {
            const key = `${e.description}|${e.ticket}|${e.projectId}`;
            if (e.organizationId !== org.id || new Date(e.startedAt) < since || seen.has(key)) return false;
            seen.add(key);
            return true;
          });
      }

      function matches(entry, text) {
        const q = text.toLowerCase();
        return [entry.description, entry.ticket, entry.project?.name].some((v) => v?.toLowerCase().includes(q));
      }

      // A key at the start of the text becomes the ticket, as Snowtime's detectTicket does.
      function split(text) {
        const m = /^\[?([A-Z][A-Z0-9]{1,9}-[1-9]\d{0,6})\]?\s+(.*)$/.exec(text);
        return m ? { ticket: m[1], description: m[2] } : { ticket: undefined, description: text };
      }

      // In every row's panel: the timer form with the typed text, as the New timer row opens
      // it, or empty when nothing is typed; with the remembered project either way.
      function newTimer(text) {
        return {
          title: "New Timer",
          icon: "Plus",
          shortcut: "cmd+n",
          goto: text ? "Form: from the search" : "Form: new timer",
        };
      }

      function row(e, timerRuns, text) {
        const isRunning = e === running;
        return {
          icon: e.project ? "CircleFilled" : "Circle",
          iconColor: e.project?.color ?? "var(--muted)",
          title: format.label(e),
          subtitle: e.project?.name ?? "No project",
          accessories: [
            ...format.ticketTag(e),
            isRunning
              ? { tag: { value: `Running ${format.duration(e)}`, color: "orange" } }
              : { text: format.time(e.startedAt), tooltip: "Last started" },
          ],
          actions: [
            {
              title: isRunning ? "Start Again" : "Start Timer",
              icon: "Play",
              goto: running && !isRunning ? "Started, stopping another" : "Started",
            },
            { title: "Edit and Start", icon: "Pencil", goto: "Form: from a suggestion" },
            newTimer(text),
            { title: "Copy Description", icon: "CopyClipboard", shortcut: "cmd+c" },
            { title: "Open Snowtime", icon: "Globe", shortcut: "cmd+o" },
            { title: "Refresh", icon: "ArrowClockwise", shortcut: "cmd+r" },
            ...(timerRuns
              ? [{ title: "Stop Timer", icon: "Stop", shortcut: "cmd+s", goto: "Stopped", section: "Running Timer" }]
              : []),
          ],
        };
      }

      function newTimerRow(text, goto) {
        const { ticket, description } = split(text);
        return {
          icon: "Plus",
          title: description,
          subtitle: "New timer",
          accessories: ticket ? [{ tag: ticket }] : [],
          // ⌘N runs this action too, so New Timer's shortcut works on every row.
          actions: [{ title: "Edit and Start", icon: "Pencil", shortcut: "cmd+n", goto }],
        };
      }

      // Stop Timer shows on every row while a suggestion runs, as in Recent Entries.
      function byDay(list, text) {
        const days = [];
        const timerRuns = list.includes(running);
        for (const e of list) {
          const title = format.dayTitle(e.startedAt);
          let day = days.find((d) => d.title === title);
          if (!day) days.push((day = { title, items: [] }));
          day.items.push(row(e, timerRuns, text));
        }
        return days;
      }

      function list({ text = "", org = orgs.northwind, several = true, extra = [], include = [], ...rest } = {}) {
        const found = suggestions(org, include).filter((e) => !text || matches(e, text));
        return {
          type: "list",
          searchPlaceholder: "What are you working on?",
          searchText: text,
          accessory: several ? org.name : undefined,
          sections: [...byDay(found, text), ...extra],
          ...rest,
        };
      }

      // The form the list pushes, as timer-form.html draws it; `back: false` when it opens in
      // the list's place.
      function form({ description, ticket, project = remembered, back = true }) {
        // With a description, the cursor waits in Ticket; an empty form starts at Description.
        return {
          type: "form",
          navigationTitle: "Start Timer",
          back,
          fields: [
            {
              type: "textfield",
              title: "Description",
              value: description,
              placeholder: "What are you working on?",
              focused: !description,
            },
            {
              type: "textfield",
              title: "Ticket",
              value: ticket,
              placeholder: "ABC-123",
              focused: !!description && !ticket,
              info: "Left empty, a ticket key in the description, such as ABC-123, becomes the ticket.",
            },
            {
              type: "dropdown",
              title: "Project",
              value: project.name,
              icon: "CircleFilled",
              iconColor: project.color,
              info: "Remembered for the next timer. Changing the organization clears it.",
            },
            { type: "separator" },
            { type: "dropdown", title: "Organization", value: orgs.northwind.name, icon: "Building" },
          ],
          actions: [{ title: "Start Timer", icon: "Play", goto: "Started" }],
        };
      }

      const failure = (message, action) => ({
        style: "failure",
        title: "Couldn't load recent entries",
        message,
        primaryAction: action && { title: action },
      });

      Raycast.prototype({
        title: "Start Timer",
        notes: [
          "Type what you're working on. Matching entries from today and yesterday show below (the Suggestions From preference); ↵ starts one at once, ⌘↵ opens the form to change it first.",
          "With no match, ↵ opens the timer form with the typed description, a ticket key at its start split off, and the remembered project.",
          "Each description, ticket, and project shows once here, at its newest entry; Recent Entries lists every entry.",
          "New Timer (⌘N), in every row's actions, opens the form as the New timer row does: with the typed text, or empty when nothing is typed, and the remembered project. While a suggestion runs, every row also has Stop Timer (⌘S).",
          "From Raycast's root search, Start Timer takes an optional Description argument (Tab after the command), and as a fallback command it takes the root search's text. With a match among the suggestions, the list opens with the text in the search bar, as if typed there. With none, the timer form opens in the list's place, prefilled, so Esc goes back to root search. Start Timer decides once, on the fresh suggestions, never while typing in the list; until then the list stays empty with its loading bar.",
        ],
        states: {
          Loading: () => list({ isLoading: true, sections: [] }),
          Suggestions: () => list(),
          "One organization": () => list({ several: false }),
          "Without descriptions": () =>
            list({ include: [Fixtures.withoutDescription.ticketOnly, Fixtures.withoutDescription.bare] }),
          "Typing: matches": () =>
            list({
              text: "inbox",
              extra: [{ title: "New", items: [newTimerRow("inbox", "Form: from the search")] }],
            }),
          // Root search: Start Timer, Tab, "inbox", ↵; or "inbox" with Start Timer as the fallback.
          // Until the fresh suggestions decide between the list and the form, the list stays
          // empty with its loading bar, so cached rows don't flash before a form.
          "Opened with an argument: loading": () => list({ text: "inbox", isLoading: true, sections: [] }),
          "Opened with an argument: matches": () =>
            list({
              text: "inbox",
              extra: [{ title: "New", items: [newTimerRow("inbox", "Form: from the search")] }],
            }),
          // Root search: Start Timer, Tab, "OPS-9 Budget review", ↵. Nothing matches, so the form
          // opens instead of the list.
          "Opened with an argument: no match": () =>
            form({ description: "Budget review", ticket: "OPS-9", back: false }),
          "Typing: no match": () =>
            list({
              text: "Quarterly report",
              extra: [{ items: [newTimerRow("Quarterly report", "Form: from the search")] }],
            }),
          "Typing: ticket, no match": () =>
            list({
              text: "OPS-9 Budget review",
              extra: [{ items: [newTimerRow("OPS-9 Budget review", "Form: ticket from the search")] }],
            }),
          "Form: from the search": () => form({ description: "Quarterly report" }),
          "Form: new timer": () => form({}),
          "Form: ticket from the search": () => form({ description: "Budget review", ticket: "OPS-9" }),
          "Form: from a suggestion": () =>
            form({ description: "Inbox triage", ticket: "OPS-7", project: projects.internal }),
          "No recent entries": () =>
            list({
              org: orgs.harbor,
              emptyView: {
                icon: "Clock",
                title: "No entries since yesterday",
                description: "Type what you're working on to start a timer.",
                actions: [newTimer()],
              },
            }),
          "Error: key not valid (401)": () =>
            list({
              sections: [],
              toast: failure("Invalid API key.", "Open Extension Preferences"),
              emptyView: {
                icon: "Key",
                title: "Invalid API key",
                description: "Check the API key in the extension's preferences.",
                actions: [{ title: "Open Extension Preferences", icon: "Gear" }],
              },
            }),
          "Error: no connection": () =>
            list({
              sections: [],
              toast: failure("Can't reach snowtime.snowhound.eu.", "Open Extension Preferences"),
              emptyView: {
                icon: "WifiDisabled",
                title: "Can't reach snowtime.snowhound.eu",
                description: "Check your connection or the instance URL in the extension's preferences.",
                actions: [
                  { title: "Refresh", icon: "ArrowClockwise" },
                  { title: "Open Extension Preferences", icon: "Gear" },
                ],
              },
            }),
          Started: () => ({ type: "hud", title: "Started “Inbox triage” on OPS-7" }),
          "Started, without a description": () => ({ type: "hud", title: "Started a timer" }),
          Stopped: () => ({
            type: "hud",
            title: `Stopped “${running.description}” at ${format.duration(running)}`,
          }),
          "Started, stopping another": () => ({
            type: "hud",
            title: `Started “Inbox triage” and stopped “${running.description}” at ${format.duration(running)}`,
          }),
        },
        initial: "Suggestions",
      });
    </script>
  </body>
</html>
